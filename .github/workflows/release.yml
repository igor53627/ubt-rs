name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # OIDC token for crates.io Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - name: Verify version matches tag
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $CARGO_VERSION"

      - name: Run tests
        run: cargo test

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Extract the changelog section for this version
          NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          # Handle multi-line output
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # A re-run after a failure in a later step must not publish the same version again.
      - name: Check whether this version is already on crates.io
        id: published
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "User-Agent: ${REPOSITORY} release workflow" \
            "https://crates.io/api/v1/crates/ubt/${VERSION}")
          case "$STATUS" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT"; echo "ubt ${VERSION} is already published; the publish steps are skipped." ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT"; echo "ubt ${VERSION} is not published yet." ;;
            *) echo "::error::Unexpected HTTP status ${STATUS} from crates.io"; exit 1 ;;
          esac

      # Exchange the GitHub OIDC token for a short-lived crates.io token.
      - name: Authenticate with crates.io (Trusted Publishing)
        id: auth
        if: steps.published.outputs.exists != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        if: steps.published.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --allow-dirty

      # The GitHub Release is created only after the crate is on crates.io,
      # so a release never points to a version that does not exist.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ${{ steps.changelog.outputs.notes }}

            [crates.io](https://crates.io/crates/ubt/${{ github.ref_name }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${GITHUB_REF_NAME} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | [${GITHUB_REF_NAME}](https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Crate | [ubt](https://crates.io/crates/ubt) |" >> $GITHUB_STEP_SUMMARY
